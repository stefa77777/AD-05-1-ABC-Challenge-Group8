<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APRENDE EL ABC</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  
  <nav class="navbar navbar-dark bg-dark px-4 py-3 sticky-top">
    <span class="navbar-brand mb-0 h1">APRENDE EL ABC</span>
    <span class="navbar-text text-white fs-5">
      Letras descubiertas: <span id="contador" class="badge bg-primary">0</span>/26
    </span>
  </nav>

  <div class="container my-4">
   
    <div class="d-flex justify-content-center gap-2 mb-4">
      <button class="btn btn-outline-primary active" onclick="filtrar('todas')">Todas</button>
      <button class="btn btn-outline-primary" onclick="filtrar('vocales')">Vocales</button>
    </div>

    
    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="galeria">
      <div class="col card-col" data-tipo="vocal">
  <div class="card h-100 text-center shadow-sm" onclick="voltear(this)">
    <div class="card-frente p-4 bg-white rounded">
      <h1 class="display-3 fw-bold text-primary mb-0">A</h1>
    </div>
    <div class="card-dorso p-2 bg-white rounded d-none">
      <img src="https://img.magnific.com/vector-gratis/ilustracion-vectorial-colorida-mitades-aguacate_1308-181983.jpg?semt=ais_hybrid&w=740&q=80" class="img-fluid rounded mb-2" style="max-height: 120px; object-fit: contain;" alt="Aguacate">
      <h5 class="fw-bold text-dark">Aguacate</h5>
    </div>
  </div>
</div>
    </div>
  </div>


  <footer id="equipo" class="bg-dark text-white text-center py-3 mt-5">
    <h5>Team</h5>
    <p class="mb-0">stefania redondo, alejandra carreño, dayana vallejo, juan calderon</p>
  </footer>

  <script src="script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
